    <script>
      // Applied before the first paint: reading the stored theme from a
      // module would be one load too late and would flash the wrong ground
      // colour. Kept in sync with ui/theme.ts's THEME_KEY.
      try {
        var carmineTheme = localStorage.getItem("carmine.theme");
        if (carmineTheme === "light" || carmineTheme === "dark") {
          document.documentElement.dataset.theme = carmineTheme;
        }
      } catch (error) {
        /* private browsing: fall back to the system theme */
      }
